<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>電気抵抗シミュレーション（改良版）</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>電気抵抗シミュレーション</h1>
        <p>抵抗の長さ・断面積・抵抗率を変えて、電子の流れやすさの違いを観察できます。</p>
      </header>

      <section class="sim-wrapper" aria-label="シミュレーションエリア">
        <canvas id="simCanvas"></canvas>
        <div class="readout" id="readout"></div>
      </section>
    </main>

    <footer class="controls" aria-label="シミュレーション設定">
      <label class="control">
        <span>長さ L</span>
        <input id="lengthSlider" type="range" min="1" max="10" step="0.1" value="5" />
        <strong id="lengthValue"></strong>
      </label>
      <label class="control">
        <span>断面積 A</span>
        <input id="areaSlider" type="range" min="0.5" max="5" step="0.1" value="2.5" />
        <strong id="areaValue"></strong>
      </label>
      <label class="control">
        <span>抵抗率 ρ</span>
        <input id="rhoSlider" type="range" min="0.5" max="5" step="0.1" value="1.5" />
        <strong id="rhoValue"></strong>
      </label>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
